  - pytorch
  - defaults

dependencies:
  - python=3.10
  - pytorch::pytorch=2.1.0
  - pytorch::pytorch-cuda=11.8
  - pip
  - pip:
      - mace-torch==0.3.3
      - ase==3.22.1
      - fair-esm==2.0.0
  - numpy=1.24.3
  - scipy=1.11.3
  - pandas=2.1.1
  - matplotlib=3.8.0
  - mdtraj=1.9.9
  - rdkit=2023.9.1
  - openmm>=8.1.1
  - py3dmol=2.0.4
  - pyyaml=6.0.1
  - requests=2.31.0
  - tqdm=4.66.1
  - pytest=7.4.2
